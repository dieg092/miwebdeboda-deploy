name: Deploy a producción

# Lo lanza la CI de main de wedding-invite-2 al terminar en verde (paso «Request
# production deploy», con DEPLOY_DISPATCH_TOKEN) o el propietario desde Actions.
# Lo lance quien lo lance, decide scripts/verify-deployable.mjs.
#
# Separación de jobs (cada job es una máquina nueva):
#   verify   solo código de este repositorio + token de LECTURA de la app.
#   assets   código de la app (genera variantes de imagen) SIN ningún secreto.
#   deploy   secretos de producción, pero solo código de este repositorio y
#            herramientas fijadas en su package-lock (vercel, AWS SDK): de la app
#            solo se leen ficheros, nunca se ejecutan.
#   smoke    código de la app SIN secretos, contra la web ya desplegada.
#   seo-gate freno SEO: si el rango a desplegar trae commits seo(…), los para con el
#            freno o el interruptor SEO activos. Código de seo-agent (público, commit
#            fijado) con el rol seo_ci (solo lee SeoControl y escribe DeployEvent).
#   record   registra el despliegue (base de la comprobación de tests) y avisa.
#   seo-record registra el despliegue en seo-agent (DeployEvent) para medir los cambios SEO.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit de main a desplegar (sha completo; vacío = HEAD de main). Solo se acepta el HEAD de main."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-produccion
  cancel-in-progress: false

env:
  APP_REPO: dieg092/wedding-invite-2
  # seo-agent es público; se fija el commit para que un cambio allí no entre aquí sin revisarlo.
  SEO_AGENT_REPO: dieg092/seo-agent
  SEO_AGENT_SHA: cd800826fde4a6864227b64593da87bc2b1bf863

jobs:
  verify:
    name: Verificar
    # Solo la versión de este workflow que está en main (un dispatch puede pedir otra rama).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # hasta 15 min esperando a que termine la CI que pidió el despliegue (waitForCi)
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: read
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verificar que el commit es desplegable
        id: verify
        env:
          GH_TOKEN: ${{ secrets.APP_READ_TOKEN }}
          # el registro de despliegues y el HEAD de este repositorio (APP_READ_TOKEN no ve este repositorio)
          DEPLOY_GH_TOKEN: ${{ github.token }}
          DEPLOY_REPO: ${{ github.repository }}
          # el input solo llega como variable de entorno, nunca interpolado en el script
          REQUESTED: ${{ inputs.sha }}
        run: node scripts/verify-deployable.mjs

  assets:
    name: Variantes de imagen (sin secretos)
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Descargar wedding-invite-2 en el commit verificado
        uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ needs.verify.outputs.sha }}
          token: ${{ secrets.APP_READ_TOKEN }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # variantes ya generadas, por hash de contenido (sin esto, ~1-2 min en cada
      # despliegue). Solo la usa este job sin secretos; el de deploy no restaura cachés.
      - uses: actions/cache@v4
        with:
          path: .next/cache/blog-image-variants
          key: blog-variants-${{ hashFiles('public/images/blog/**') }}
          restore-keys: blog-variants-
      - run: pnpm exec tsx scripts/generate-blog-image-variants.ts
      - uses: actions/upload-artifact@v4
        with:
          name: blog-variants-${{ needs.verify.outputs.sha }}
          path: public/img-variants/blog
          retention-days: 1
          if-no-files-found: error

  seo-gate:
    name: Freno SEO
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: read
    outputs:
      base: ${{ steps.range.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Commit que está ahora en producción
        id: range
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_REPO: ${{ github.repository }}
        run: node scripts/ultimo-desplegado.mjs
      - name: Descargar wedding-invite-2 con historial (solo para leer los asuntos)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ needs.verify.outputs.sha }}
          token: ${{ secrets.APP_READ_TOKEN }}
          path: app
          fetch-depth: 0
          persist-credentials: false
      - name: Commits seo(…) del rango
        id: seo
        env:
          BASE: ${{ steps.range.outputs.sha }}
          SHA: ${{ needs.verify.outputs.sha }}
        run: |
          git -C app log --format=%s "$BASE..$SHA" > subjects.txt
          n=$(grep -cE '^seo\([0-9a-zA-Z-]{4,40}\)' subjects.txt || true)
          echo "Commits seo(…) en el rango: $n"
          echo "count=$n" >> "$GITHUB_OUTPUT"
      - name: Descargar seo-agent (commit fijado)
        if: steps.seo.outputs.count != '0'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SEO_AGENT_REPO }}
          ref: ${{ env.SEO_AGENT_SHA }}
          path: seo-agent
          persist-credentials: false
      - name: Instalar seo-agent sin caché (el job tiene un secreto)
        if: steps.seo.outputs.count != '0'
        working-directory: seo-agent
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate
          pnpm install --frozen-lockfile
          pnpm db:generate
      - name: seo-brake-gate
        if: steps.seo.outputs.count != '0'
        working-directory: seo-agent
        env:
          DATABASE_URL: ${{ secrets.SEO_CI_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.SEO_CI_DATABASE_URL }}
        run: pnpm exec tsx scripts/seo-brake-gate.ts push < ../subjects.txt

  deploy:
    name: Desplegar
    if: github.ref == 'refs/heads/main'
    needs: [verify, assets, seo-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # herramientas de este repositorio, versiones exactas del lockfile, sin scripts de instalación
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Descargar wedding-invite-2 en el commit verificado (solo ficheros)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ needs.verify.outputs.sha }}
          token: ${{ secrets.APP_READ_TOKEN }}
          path: app
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: blog-variants-${{ needs.verify.outputs.sha }}
          path: app/public/img-variants/blog

      # Las imágenes del blog no viajan al deployment (.vercelignore): se sirven desde
      # S3 y se suben antes para que una imagen nueva no llegue con 404.
      - name: Subir imágenes del blog a S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: node scripts/upload-blog-images.mjs app/public || echo "::error::Faltan imágenes del blog en S3; el despliegue sigue (README)."

      # build:vercel corre 'prisma migrate deploy' contra producción dentro de este
      # deploy, en Vercel y con las variables de producción que guarda Vercel.
      - name: Deploy to Vercel (production)
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SHA: ${{ needs.verify.outputs.sha }}
        run: |
          url=$(node_modules/.bin/vercel deploy app --prod --yes --token="$VERCEL_TOKEN" --meta githubCommitSha="$SHA")
          echo "url=$url" >> "$GITHUB_OUTPUT"

  smoke:
    name: Smoke test (sin secretos)
    if: github.ref == 'refs/heads/main'
    needs: [verify, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ needs.verify.outputs.sha }}
          token: ${{ secrets.APP_READ_TOKEN }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm smoke:post-deploy

  record:
    name: Registrar y avisar
    if: always() && github.ref == 'refs/heads/main'
    needs: [verify, assets, seo-gate, deploy, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # El último commit desplegado es la base para detectar tests borrados o
      # desactivados en el siguiente. Solo este job puede escribirlo (GITHUB_TOKEN).
      - name: Registrar el despliegue
        if: needs.deploy.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.verify.outputs.sha }}
          URL: ${{ needs.deploy.outputs.url }}
          REPO: ${{ github.repository }}
        run: |
          id=$(jq -n --arg sha "$SHA" '{ref: "main", environment: "produccion", auto_merge: false, required_contexts: [],
                 description: ("wedding-invite-2 " + $sha[0:7]), payload: {app_sha: $sha}}' \
               | gh api "repos/$REPO/deployments" -X POST --input - --jq .id)
          gh api "repos/$REPO/deployments/$id/statuses" -X POST -f state=success -f environment_url="$URL" >/dev/null

      - name: Alertas
        env:
          DEPLOY: ${{ needs.deploy.result }}
          SMOKE: ${{ needs.smoke.result }}
        run: |
          if [ "$DEPLOY" = success ] && [ "$SMOKE" != success ]; then
            echo "::error::🚨 Deploy promovido pero el smoke test no terminó en éxito. Revisión manual inmediata; rollback en Vercel solo si la migración del deploy es compatible hacia atrás (README)."
          fi
          if [ "$DEPLOY" = failure ]; then
            echo "::error::⚠️ Deploy fallido. La migración de producción pudo aplicarse antes de que fallara el build: revisar el log de Vercel antes de reintentar."
          fi

      - name: Build Telegram message
        id: telegram-message
        env:
          SHA: ${{ needs.verify.outputs.sha }}
          VERIFY: ${{ needs.verify.result }}
          DEPLOY: ${{ needs.deploy.result }}
          SMOKE: ${{ needs.smoke.result }}
          ASSETS: ${{ needs.assets.result }}
          SEO_GATE: ${{ needs.seo-gate.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$DEPLOY" = success ] && [ "$SMOKE" = success ]; then EMOJI="✅"; STATUS=success
          elif [ "$DEPLOY" = success ]; then EMOJI="🚨"; STATUS="DEPLOY PROMOVIDO SIN SMOKE EN VERDE"
          elif [ "$VERIFY" = cancelled ] || [ "$ASSETS" = cancelled ] || [ "$DEPLOY" = cancelled ] || [ "$SMOKE" = cancelled ]; then
            # nadie cancela un despliegue a propósito: avisar (el token de despacho puede cancelar ejecuciones)
            EMOJI="🛑"; STATUS="CANCELADO: comprobar quién lo canceló y relanzarlo"
          elif [ "$VERIFY" != success ]; then EMOJI="⛔"; STATUS="no desplegado: no pasa la verificación"
          elif [ "$SEO_GATE" = failure ]; then EMOJI="⛔"; STATUS="no desplegado: freno SEO (commits seo(…) con el freno o el interruptor activos)"
          else EMOJI="❌"; STATUS=failure; fi
          {
            echo "text<<TELEGRAM_MSG_EOF"
            echo "$EMOJI <b>Deploy miwebdeboda.com</b>: $STATUS"
            echo "verificación: $VERIFY · freno SEO: $SEO_GATE · deploy: $DEPLOY · smoke: $SMOKE"
            echo "Commit ${SHA:-sin verificar}"
            echo "$RUN_URL"
            echo "TELEGRAM_MSG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Notify Telegram
        uses: ./.github/actions/notify-telegram
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          message: ${{ steps.telegram-message.outputs.text }}

  seo-record:
    name: Registrar en seo-agent
    if: always() && github.ref == 'refs/heads/main' && needs.deploy.result == 'success'
    needs: [verify, seo-gate, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Si falla, el despliegue ya está hecho: solo se pierde la marca para medir.
    continue-on-error: true
    steps:
      - name: Descargar wedding-invite-2 con historial (solo para leer los asuntos)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ needs.verify.outputs.sha }}
          token: ${{ secrets.APP_READ_TOKEN }}
          path: app
          fetch-depth: 0
          persist-credentials: false
      - name: Descargar seo-agent (commit fijado)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SEO_AGENT_REPO }}
          ref: ${{ env.SEO_AGENT_SHA }}
          path: seo-agent
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Registrar DeployEvent
        working-directory: seo-agent
        env:
          DATABASE_URL: ${{ secrets.SEO_CI_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.SEO_CI_DATABASE_URL }}
          BASE: ${{ needs.seo-gate.outputs.base }}
          SHA: ${{ needs.verify.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::warning::Falta SEO_CI_DATABASE_URL: no se registra en seo-agent"; exit 0; fi
          corepack enable
          corepack prepare pnpm@9 --activate
          pnpm install --frozen-lockfile
          pnpm db:generate
          git -C ../app log --format=%s "$BASE..$SHA" | pnpm exec tsx scripts/record-deploy.ts "$SHA" "$RUN_URL"
